# Décision D1 (2026-09-20) : `pnpm check` et `pnpm test` rejoués hors de la machine de l'auteur,
# sur chaque PR et sur main. C'est la seule preuve publique que les tests bloquants le sont.
#
# Seules les actions officielles de GitHub (checkout, setup-node, setup-python) sont utilisées, épinglées par empreinte de commit
# (une étiquette peut être déplacée, une empreinte non). pnpm vient de corepack, livré avec Node, à
# la version que fixe `packageManager` dans package.json : aucune action tierce, aucune dépendance.
# Node 22 est le plancher déclaré par `engines` : c'est lui qu'on vérifie.
name: verification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check-et-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      # Site statique (plan de la page pédagogique, 2026-11-05) : construit avant les tests, car les
      # tests de garde de tests/site/ lisent site/dist/ (ressources externes, noms, renvois au protocole).
      - run: pnpm build:site
      - run: pnpm test
      # Pipeline Python (sous-lot C1, décision du 2026-09-22) : Python épinglé par .python-version,
      # uv installé par pip à version fixe (aucune action tierce), dépendances rejouées depuis uv.lock.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - run: python -m pip install uv==0.12.17
      - run: uv sync --frozen
      - run: uv run ruff check pipeline tests
      - run: uv run pytest
