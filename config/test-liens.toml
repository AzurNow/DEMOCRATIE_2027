# Table résultat → verdict du test HTTP des liens (§7 : « le lien cité existe (test HTTP
# déterministe) »), décisions D20 (2026-10-08) et D21 (2026-10-08) de l'auteur. Lue par
# `pipeline/liens/table.py` ; jamais recopiée dans le code (schema/notation.schema.json, description
# de `verdict_existence`).
#
# TOML et non YAML : Python n'a pas de lecteur YAML dans ses dépendances, et aucune ne s'ajoute
# (tomllib est dans la bibliothèque standard). D20 disait « config/test-liens.yaml ».
#
# Changer une ligne de ce fichier change une mesure : c'est un amendement (§9), et `version` change
# avec lui. Elle est recopiée dans chaque résultat (`version_table`).
#
# Lecture de la table, pour un résultat de la DERNIÈRE tentative :
# - réponse HTTP finale, après les redirections suivies une à une (301, 302, 303, 307, 308) : un code
#   listé dans `codes_http` l'emporte sur sa classe (`classes_http`, « 4xx ») ; 404 est donc « mort »
#   bien que 4xx soit « inaccessible » ;
# - pas de réponse HTTP finale : l'issue nommée (`issues`) décide.
# Un code, une classe ou une issue présent sous deux verdicts rend la table ambiguë : elle est
# refusée au chargement. Un résultat que la table ne classe pas n'a PAS de verdict : le lien reste
# sans verdict, le passage le signale et sort en erreur ; rien n'est supposé. Depuis la v2, toute
# issue et toute classe de code sont classées.
#
# Issues que le code sait produire : delai_depasse, connexion_refusee, erreur_tls,
# domaine_inexistant (le résolveur dit que le nom n'existe pas), erreur_reseau (autre panne sans
# réponse HTTP : connexion réinitialisée, panne du résolveur EAI_AGAIN ou EAI_FAIL, corps tronqué),
# robots_interdit, robots_injoignable (erreur réseau ou code hors 2xx/4xx en lisant robots.txt),
# schema_non_http (l'URL ou une cible de redirection), url_malformee (y compris une IRI que la
# conversion ci-dessous ne sait pas convertir), redirections_excessives (plus de 5),
# boucle_redirection, redirection_sans_location.
#
# v1 → v2 (D21) : erreur_reseau, redirection_sans_location, codes 1xx et 3xx non suivis (300, 304…)
# ⇒ inaccessible ; erreur_reseau et robots_injoignable deviennent transitoires (robots.txt est relu à
# chaque tentative après un échec de lecture ; lu avec succès, il reste valable pour le passage) ;
# le délai par requête et la conversion IRI → URI entrent dans la table ; l'issue url_non_ascii
# disparaît.
#
# v2 → v3 (D55 (2), revue du 2026-10-12, constat 2) : `http.client` décode tout en-tête `Location`
# en latin-1, y compris quand le serveur l'a envoyé en octets UTF-8 bruts (slug accentué, pratique
# courante, suivie par tout navigateur). La sonde réencodait alors la chaîne mal décodée, obtenait un
# 404 de la cible déformée, et un lien valide se rangeait sous « mort ». La règle de relecture
# (`lecture_location`) entre dans la table, au même titre que `conversion_iri`.

version = "table-liens-v3"

# D21 : une URL citée non ASCII (IRI) est convertie en URI pour l'envoi seulement, selon RFC 3987
# §3.1 : percent-encoding UTF-8 des caractères non ASCII du chemin, de la requête et du fragment,
# hôte en IDNA ; les `%XX` déjà présents et tous les caractères ASCII restent tels qu'écrits.
# `url_citee`, le dédoublonnage et le nom du fichier de résultat gardent la chaîne exacte. Une IRI
# inconvertible ⇒ url_malformee. Seule valeur connue du code : "rfc3987-3.1".
conversion_iri = "rfc3987-3.1"

# D55 (2) : l'en-tête `Location` d'une redirection est relu en UTF-8 quand l'aller-retour
# latin-1 → UTF-8 réussit, sinon rendu tel quel (même règle que la bibliothèque `requests`), avant la
# conversion IRI → URI ci-dessus. Seule valeur connue du code : "utf-8-si-aller-retour-latin-1".
lecture_location = "utf-8-si-aller-retour-latin-1"

# D21 : délai d'une requête du test des liens, en secondes (URL citée, robots.txt, API de
# disponibilité Wayback, téléchargement d'un instantané). Save Page Now garde le sien.
delai_s = 30

# D20 : « 3 tentatives au plus, espacées de 60 s » pour un échec transitoire ; 404 et 410 sont
# définitifs dès la première réponse. Le dernier résultat obtenu est lu dans `verdicts`.
[tentatives]
maximum = 3
espacement_s = 60

# D20 : échecs transitoires, retentés : délai dépassé, connexion refusée, 429, 5xx.
# D21 : erreur réseau et robots.txt injoignable aussi.
[transitoire]
codes_http = [429]
classes_http = ["5xx"]
issues = ["delai_depasse", "connexion_refusee", "erreur_reseau", "robots_injoignable"]

# D20 : « 2xx après redirections ⇒ existe ». Une page « introuvable » servie en 200 existe : le test
# est déterministe, le juge dira « ne soutient pas ».
[verdicts.existe]
codes_http = []
classes_http = ["2xx"]
issues = []

# D20 : « 404, 410, domaine inexistant ⇒ mort ».
[verdicts.mort]
codes_http = [404, 410]
classes_http = []
issues = ["domaine_inexistant"]

# D20 : « 401, 403, 429, 451, tout autre 4xx, 5xx, délai dépassé, connexion refusée, erreur TLS ⇒
# inaccessible ». Précision de la session principale : robots.txt injoignable (erreur réseau ou
# 5xx) ⇒ inaccessible, jamais une autorisation implicite.
# D21 : erreur réseau, redirection sans Location, codes 1xx et 3xx non suivis ⇒ inaccessible.
[verdicts.inaccessible]
codes_http = [401, 403, 429, 451]
classes_http = ["1xx", "3xx", "4xx", "5xx"]
issues = ["delai_depasse", "connexion_refusee", "erreur_tls", "erreur_reseau", "robots_injoignable", "redirection_sans_location"]

# D20 : « robots.txt interdit, schéma non http(s), URL malformée, plus de 5 redirections ou boucle ⇒
# non_testable ». Un lien interdit par robots.txt n'est jamais contourné.
[verdicts.non_testable]
codes_http = []
classes_http = []
issues = ["robots_interdit", "schema_non_http", "url_malformee", "redirections_excessives", "boucle_redirection"]
